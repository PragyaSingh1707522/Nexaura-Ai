services:
  api:
    build:
      context: ./backend
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://regulalens:${POSTGRES_PASSWORD:-regulalens_dev}@postgres:5432/regulalens
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: regulatory_chunks
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      RETRIEVAL_DEFAULT: ${RETRIEVAL_DEFAULT:-hybrid_rerank}
      RISK_MODEL: ${RISK_MODEL:-selected}
      CLAUSE_MODEL: ${CLAUSE_MODEL:-tfidf}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      LOCAL_SLM_URL: ${LOCAL_SLM_URL:-}
      LOCAL_SLM_MODEL: ${LOCAL_SLM_MODEL:-}
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_ROLE: ${AUTH_ROLE:-admin}
      AUTH_SECRET: ${AUTH_SECRET:-}
      UPLOAD_DIR: /app/data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
    volumes: ["api_data:/app/data"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports: ["5173:80"]
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: regulalens
      POSTGRES_USER: regulalens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regulalens_dev}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regulalens -d regulalens"]
      interval: 5s
      timeout: 3s
      retries: 10
  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
volumes:
  postgres_data:
  qdrant_data:
  api_data:
